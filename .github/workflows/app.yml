name: App

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  push:
    branches: [master]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }

  android:
    needs: web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with: { name: investing-debug-apk, path: app/android/app/build/outputs/apk/debug/*.apk }

  # Publishes the web dashboard (sample portfolio, since personal holdings are never committed).
  # Needs Settings > Pages > Source set to "GitHub Actions".
  pages:
    if: github.ref == 'refs/heads/master'
    needs: web
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
